[package]
name = "terminal-input"
version = "0.1.0"
description = "What the Pullcept room types into a session's terminal, which terminals it types into, and when it holds back"
authors = ["Liplus Project Contributors"]
license = "Apache-2.0"
edition = "2021"

# Free of tauri for the reason docs/5-development.md gives: a test binary that
# links the tauri dependency tree does not load on the GNU target. What a post
# reads as once it is typed, the role on its label, that nothing in it can press
# the submit key, which terminals it reaches, and what the terminal pane's keys
# leave unsent are the parts of #183 / #195 a reader cannot settle by reading.

[dependencies]
serde_json = "1"
# The post's time on the label, read as this PC's local time (#219). `clock`
# is what reads the local offset; the rest of the defaults are not needed.
chrono = { version = "0.4", default-features = false, features = ["clock"] }

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'unsafe-inline'; frame-src about:; base-uri 'none'; form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pullcept</title>
    <style>html,body{height:100%;margin:0}body{display:flex;flex-direction:column;font:14px system-ui,sans-serif;background:#fff;color:#222}p{margin:10px}main{flex:1;min-height:0;display:flex}main[hidden],.code[hidden]{display:none}
/* The window's own title bar (#468), as the main window's (#252): the side pane's header in the row the standard frame's title stood in, then the window's three. */
header{display:flex;align-items:center;gap:.5rem;padding:0 0 0 .6rem;min-height:2.5rem;border-bottom:1px solid #0002;background:#f6f6f5;user-select:none}
header strong{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.views{display:inline-flex;padding:2px;gap:2px;border:1px solid #0002;border-radius:8px;background:#0000000d}
.views button{margin:0;padding:.2rem .7rem;border:0;border-radius:6px;background:transparent;color:inherit;font:inherit;opacity:.7;cursor:pointer}
.views button:hover{opacity:1}.views button[aria-pressed="true"]{background:#f6f6f5;opacity:1;box-shadow:0 1px 2px #0003}
.return-main{display:inline-flex;align-items:center;gap:.35rem;height:2rem;padding:0 .5rem;border:0;border-radius:6px;background:transparent;color:inherit;font:inherit;font-size:.85rem;cursor:pointer}
.return-main:hover{background:color-mix(in srgb,currentColor 12%,transparent)}
.return-main svg{width:1rem;height:1rem;fill:none;stroke:currentColor;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.window-controls{display:flex;align-self:stretch}
.window-controls button{display:flex;align-items:center;justify-content:center;width:2.75rem;margin:0;padding:0;border:0;border-radius:0;background:none;color:inherit;cursor:pointer}
.window-controls button:hover{background:#0000001a}.window-controls #window-close:hover{background:#c42b1c;color:#fff}
.window-controls svg{width:1.125rem;height:1.125rem;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}
#window-maximize .restore,#window-maximize.maximized .maximize{display:none}#window-maximize.maximized .restore{display:block}
.code{flex:1;min-height:0;margin:0;padding:.6rem;overflow:auto;font:13px ui-monospace,Consolas,monospace;white-space:pre;background:#0000000a;border-top:1px solid #00000024}
iframe{flex:1;border:0;width:100%;background:white}.pane header,.pane body>p,.pane .code{display:none}</style>
    <!-- `?pane` = the side pane's child view in the main window (#466): the frame only, decided before first paint. -->
    <script>if (new URLSearchParams(location.search).has("pane")) document.documentElement.classList.add("pane");</script>
    <script type="module" src="/src/html-preview-host.ts"></script>
  </head>
  <body><header id="titlebar"><strong id="file-name">HTML</strong><div class="views" role="group" aria-label="表示の切り替え"><button type="button" id="show-preview" aria-pressed="true">プレビュー</button><button type="button" id="show-code" aria-pressed="false">コード</button></div><button type="button" id="return-main" class="return-main"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="M7 2.5H3.5a1 1 0 0 0-1 1v9a1 1 0 0 0 1 1h9a1 1 0 0 0 1-1V9"/><path d="M8 4.5V8h3.5"/><path d="M8 8l5.5-5.5"/></svg><span>メインウィンドウで開く</span></button><div class="window-controls"><button type="button" id="window-minimize" aria-label="最小化" title="最小化"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><line x1="3.5" y1="8" x2="12.5" y2="8"/></svg></button><button type="button" id="window-maximize" aria-label="最大化" title="最大化"><svg class="maximize" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><rect x="3.5" y="3.5" width="9" height="9" rx="1.2"/></svg><svg class="restore" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><rect x="3" y="5.5" width="7.5" height="7.5" rx="1.2"/><path d="M5.5 5.5V4.2A1.2 1.2 0 0 1 6.7 3h5.1A1.2 1.2 0 0 1 13 4.2v5.1a1.2 1.2 0 0 1 -1.2 1.2H10.5"/></svg></button><button type="button" id="window-close" aria-label="閉じる" title="閉じる"><svg viewBox="0 0 16 16" aria-hidden="true" focusable="false"><line x1="4" y1="4" x2="12" y2="12"/><line x1="12" y1="4" x2="4" y2="12"/></svg></button></div></header><p>HTML 内の JavaScript は、この枠の中だけで動きます。外部との通信や、外部のスクリプト・画像の読み込みはできません。</p><main id="preview" aria-label="HTML プレビュー"></main><pre id="code" class="code" tabindex="0" hidden></pre></body>
</html>

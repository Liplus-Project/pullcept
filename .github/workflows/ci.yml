name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu

      - name: Set GNU as default host
        run: rustup set default-host x86_64-pc-windows-gnu

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
            crates/mcp-config/target
            crates/room-floor/target
            crates/account-env/target
            crates/webhook-bridge/target
            crates/mcp-servers/target
            crates/terminal-input/target
          key: rust-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - uses: actions/cache@v6
        with:
          path: node_modules
          key: node-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npm ci

      - name: Type-check and build the frontend
        run: npm run build

      - name: Type-check the sidecar
        run: npm run sidecar:check

      - name: Test the sidecar round trip
        run: npm run sidecar:test

      - name: Check Rust compilation
        working-directory: src-tauri
        run: cargo check --target x86_64-pc-windows-gnu

      # Not in src-tauri: a test binary that links the tauri dependency tree
      # does not load on the GNU target (STATUS_ENTRYPOINT_NOT_FOUND). The
      # logic that most needs covering lives in a tauri-free crate for that
      # reason. See docs/0-requirements.md.
      - name: Test the mcp-config crate
        working-directory: crates/mcp-config
        run: cargo test

      - name: Test the room-floor crate
        working-directory: crates/room-floor
        run: cargo test

      - name: Test the topic-index crate
        working-directory: crates/topic-index
        run: cargo test

      # Includes the DPAPI seal/open round trip, which runs only on Windows —
      # the runner this job is on (#163).
      - name: Test the account-env crate
        working-directory: crates/account-env
        run: cargo test

      # What the app writes to and reads from the github-webhook-mcp bridge it
      # runs itself, and which rooms a notice goes into (#169).
      - name: Test the webhook-bridge crate
        working-directory: crates/webhook-bridge
        run: cargo test

      # The file the app's own MCP servers are listed in, and the text the
      # settings panel edits them through (#172).
      - name: Test the mcp-servers crate
        working-directory: crates/mcp-servers
        run: cargo test

      # What a post reads as once it is typed into a session's terminal, the
      # role on its label, which terminals it goes into, and when it waits for
      # the person's own input (#183, #195).
      - name: Test the terminal-input crate
        working-directory: crates/terminal-input
        run: cargo test

  # Gate job: single Required status check for branch protection.
  # Add new jobs to `needs` when CI grows. No Settings change needed.
  CI:
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [[ "${{ needs.check.result }}" != "success" ]]; then
            echo "CI failed: check=${{ needs.check.result }}"
            exit 1
          fi

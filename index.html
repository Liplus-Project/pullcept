<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pullcept</title>
    <script type="module" src="/src/main.ts" defer></script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app">
      <header id="titlebar">
        <span class="title">Pullcept</span>
        <!-- The roster used to be echoed here as one line. It is the
             participant panel's list now: two renderings of one roster is one
             surface too many, and the panel is always on screen. -->
        <span class="spacer"></span>
        <!-- Who this screen's person is in the room: the name they answer to
             and the colour they are drawn in. One pair, declared together,
             because they are one declaration — this is who I am here. The
             launcher below carries the same pair for a session. -->
        <label class="who">
          名前
          <input id="display-name" type="text" value="human" spellcheck="false" />
        </label>
        <label class="who">
          色
          <select id="display-hue"></select>
        </label>
        <button id="toggle-diagnostics" type="button" aria-expanded="false">診断</button>
      </header>

      <!-- The accounts. An account exists whether or not it is running, so
           this row is where one is made, named, coloured and pointed at a
           working directory — not where a launch declares those (#53). Editing
           any field here edits the account; the launch button starts the one
           selected. -->
      <div id="launcher">
        <select id="account-select" aria-label="アカウント"></select>
        <button id="account-new" type="button" title="アカウントを追加">＋</button>
        <button id="account-delete" type="button" title="選択中のアカウントを削除">−</button>
        <label class="who">
          名前
          <input id="account-name" type="text" spellcheck="false" />
        </label>
        <label class="who">
          色
          <select id="account-hue"></select>
        </label>
        <label class="cwd">
          作業ディレクトリ
          <input id="session-cwd" type="text" spellcheck="false" />
        </label>
        <button id="start-session" type="button">セッション参加</button>
      </div>

      <div id="launch-row">
        <label class="options">
          起動オプション
          <input
            id="launch-options"
            type="text"
            spellcheck="false"
            placeholder="例: --dangerously-skip-permissions"
          />
        </label>
        <span id="launch-preview" class="preview"></span>
      </div>

      <div id="body">
        <div id="conversation">
          <main id="room" aria-live="polite"></main>

          <!-- Diagnostics, not the conversation surface. The room shows what
               was said; this shows the CLI that was launched, as it actually
               renders. Nothing here is read as a message: the room's lines come
               from the channel and from say_to_room, never from this output.

               Only the terminal is left here. The values that are read rather
               than watched — the socket, the session, how it was launched —
               moved to the participant panel, where they are on screen without
               opening anything. -->
          <!-- One frame, holding a terminal per running account. All but the
               selected one are hidden rather than closed, so a session keeps
               running and keeps filling its own scrollback while another is
               being watched (#57). -->
          <aside id="diagnostics" hidden>
            <div id="terminal" aria-label="セッションの端末"></div>
          </aside>

          <footer id="composer">
            <!-- The addressee is optional. Leaving it on 全体 is a room-wide
                 utterance; who answers one of those is the participants'
                 judgment, not the room's. The room delivers every utterance to
                 everyone either way, and anyone in the roster can be named —
                 people and sessions alike. -->
            <label class="to">
              宛先
              <select id="to-select">
                <option value="">全体</option>
              </select>
            </label>
            <textarea
              id="input"
              rows="2"
              placeholder="部屋に発言する（Enter で送信 / Shift+Enter で改行）"
            ></textarea>
            <button id="send" type="button">送信</button>
          </footer>

          <div id="status" role="status"></div>
        </div>

        <!-- Who is in the room, and what the session under it was launched
             from. The values were all reachable before this panel existed;
             what was missing was a place that shows them without being
             opened.

             The list is the room's roster and the accounts that are not in it,
             joined on the account id. An account that is not running is still
             someone, so it is listed and marked offline rather than left out
             (#53); it is not offered as an addressee, because a name that
             cannot be reached is not one worth naming. -->
        <aside id="participants" aria-label="参加者">
          <h2 class="panel-title">参加者</h2>
          <!-- Seeded, because the roster only arrives once the room answers:
               a blank strip there would read as "nobody" before anyone has
               been asked. -->
          <ul id="roster" class="roster">
            <li class="empty">参加者なし</li>
          </ul>

          <!-- The terminals this screen is holding, one row per account. Not
               the roster above and not a second copy of it: that list answers
               who is in the room and is keyed on each participant's
               connection, while this one answers which sessions have a pane
               here and is keyed on the account id. The memberships differ — a
               participant who joined from elsewhere has no terminal here, and a
               session that has just exited has a terminal and no seat.

               Keying on the account id is what lets a row carry an operation:
               the pane, the input and the 終了 all act on one account, and a
               name match would tie the wrong one as soon as two accounts
               answer to one name (#53). Hidden entirely until something has
               been launched — an account with no session has no terminal to
               show or end (#57). -->
          <section id="terminals-section" class="terminals-section" hidden>
            <h2 class="panel-title">端末</h2>
            <ul id="terminals" class="terminals"></ul>
          </section>

          <!-- What the terminal on the glass was launched from. The values
               follow the row that is selected above, so they answer for the
               pane being looked at rather than for whichever session started
               last. 部屋ソケット is the exception and is the room's own. -->
          <dl class="facts">
            <dt>部屋ソケット</dt>
            <dd id="socket-state">確認中</dd>
            <dt>セッション</dt>
            <dd id="session-state">未起動</dd>
            <dt>接続方法</dt>
            <dd id="session-transport">—</dd>
            <dt>起動コマンド</dt>
            <dd id="session-command">—</dd>
            <dt>作業ディレクトリ</dt>
            <dd id="session-dir" class="path">—</dd>
            <dt>開始時刻</dt>
            <dd id="session-started">—</dd>
            <dt>ウィンドウ</dt>
            <dd id="session-window">—</dd>
          </dl>
        </aside>
      </div>
    </div>
  </body>
</html>
